# 測試使用獨立記憶體資料庫，避免與執行中的開發伺服器鎖定同一個 H2 檔案。
spring.datasource.url=jdbc:h2:mem:security_login_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.h2.console.path=/h2-ui
bezkoder.app.jwtCookieName=Authorization
bezkoder.app.jwtSecret= ======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs=86400000
app.websocket.allowed-origins=http://localhost
